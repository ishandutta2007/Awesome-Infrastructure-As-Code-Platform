<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="50%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOpacity {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.75; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .bg { fill: url(#bg-grad); }
    .grid-line { stroke: #1f2937; stroke-width: 1; opacity: 0.4; }
    .flow-path {
      stroke: url(#primary-glow);
      stroke-width: 2.5;
      stroke-dasharray: 8 6;
      animation: dashMove 3s linear infinite;
    }
    .glow-circle-1 { animation: pulseOpacity 6s ease-in-out infinite; }
    .glow-circle-2 { animation: pulseOpacity 8s ease-in-out 2s infinite; }
    .floating-group { animation: floatCard 5s ease-in-out infinite; }
    
    .title-main {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 40px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-main {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 600;
      fill: url(#text-grad);
      letter-spacing: 0.5px;
    }
    .desc-line {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      fill: #9ca3af;
    }
  </style>

  <!-- Background Card -->
  <rect class="bg" width="1200" height="350" rx="16" stroke="#1f2937" stroke-width="2" />

  <!-- Animated Glowing Orbs -->
  <circle class="glow-circle-1" cx="180" cy="90" r="140" fill="#7c3aed" filter="url(#glow)" opacity="0.4" />
  <circle class="glow-circle-2" cx="1020" cy="260" r="160" fill="#0284c7" filter="url(#glow)" opacity="0.3" />

  <!-- Grid Lines -->
  <g class="grid-lines">
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="350" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="350" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="350" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="350" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="350" class="grid-line" />
  </g>

  <!-- Flowing Infrastructure Network Lines -->
  <path d="M 80 270 L 240 190 L 460 240 L 680 160 L 880 230 L 1100 140" class="flow-path" fill="none" />
  <path d="M 160 110 L 380 170 L 580 120 L 780 190 L 980 110" class="flow-path" fill="none" />

  <!-- SMIL Animated Dynamic Nodes -->
  <g>
    <circle cx="240" cy="190" r="5" fill="#38bdf8">
      <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="460" cy="240" r="5" fill="#a78bfa">
      <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="680" cy="160" r="5" fill="#34d399">
      <animate attributeName="r" values="4;7;4" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="880" cy="230" r="5" fill="#f472b6">
      <animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Interactive Infrastructure Cards (Right Side) -->
  <g class="floating-group" transform="translate(850, 45)" filter="url(#card-shadow)">
    <rect width="280" height="68" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <circle cx="28" cy="34" r="7" fill="#10b981" />
    <text x="50" y="31" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f3f4f6">Terraform &amp; OpenTofu</text>
    <text x="50" y="49" font-family="monospace" font-size="11" fill="#9ca3af">Drift Monitoring: Active</text>
  </g>

  <g class="floating-group" transform="translate(875, 135)" filter="url(#card-shadow)">
    <rect width="260" height="68" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <circle cx="28" cy="34" r="7" fill="#3b82f6" />
    <text x="50" y="31" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f3f4f6">Policy as Code (OPA)</text>
    <text x="50" y="49" font-family="monospace" font-size="11" fill="#9ca3af">Governance: Enforced</text>
  </g>

  <g class="floating-group" transform="translate(830, 225)" filter="url(#card-shadow)">
    <rect width="300" height="68" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5" />
    <circle cx="28" cy="34" r="7" fill="#8b5cf6" />
    <text x="50" y="31" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f3f4f6">TACOS Automation Platform</text>
    <text x="50" y="49" font-family="monospace" font-size="11" fill="#9ca3af">CI/CD &amp; State Management</text>
  </g>

  <!-- Foreground Content: Title & Text -->
  <g transform="translate(60, 75)">
    <!-- Badge Pill -->
    <rect x="0" y="0" width="225" height="28" rx="14" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="14" y="18" font-family="monospace" font-size="11" font-weight="bold" fill="#60a5fa">⚡ AWESOME IaC PLATFORMS</text>

    <!-- Main Heading -->
    <text class="title-main" x="0" y="72">Infrastructure as Code</text>
    <text class="subtitle-main" x="0" y="106">COMPREHENSIVE ECOSYSTEM &amp; PLATFORM DIRECTORY</text>

    <!-- Detailed Subtext -->
    <text class="desc-line" x="0" y="144">Curated SaaS Platforms, Open-Source Engines, Policy Governance,</text>
    <text class="desc-line" x="0" y="164">Drift Detection &amp; Multi-Cloud CI/CD Automation (TACOS).</text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="344" width="1200" height="6" fill="url(#primary-glow)" />
</svg>
